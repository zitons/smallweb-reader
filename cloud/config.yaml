# These are retrieval interests, not claims about article quality.
# Initial interests live in preferences.json; saved reader settings override them.
feeds:
  - https://kagi.com/api/v1/smallweb/feed/?limit=200
embedding:
  base_url: https://api.siliconflow.cn/v1
  model: BAAI/bge-m3
# All entries returned by the feed are archived; only ranking uses pool/age limits.
pool_limit: 200
max_age_days: 30
daily_limit: 10
max_per_author: 2
max_per_topic: 3
# Explicit positive samples gradually replace topic descriptions as the profile.
profile_full_weight_samples: 10
profile_max_clusters: 10
profile_per_author: 3
# Initial heuristics; tune from actual reading feedback.
min_similarity: 0.42
duplicate_similarity: 0.90
exploration_slots: 1
timezone: Asia/Shanghai
