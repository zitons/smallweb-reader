name: Generate daily reading list
on:
  schedule:
    - cron: '17 23 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daily-reading-list
  cancel-in-progress: false
jobs:
  generate:
    if: vars.READER_API_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
          enable-cache: true
      - run: uv sync --frozen
      - uses: actions/cache@v4
        with:
          path: data/cloud/embeddings.sqlite
          key: public-article-vectors-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: public-article-vectors-${{ runner.os }}-
      - name: Collect, rank and publish
        env:
          READER_API_URL: ${{ vars.READER_API_URL }}
          READER_SYNC_TOKEN: ${{ secrets.READER_SYNC_TOKEN }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          PYTHONUNBUFFERED: '1'
        run: uv run python cloud/generate.py
