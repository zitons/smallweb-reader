name: Sync article archive
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: article-archive-sync
  cancel-in-progress: false
jobs:
  sync:
    if: vars.READER_API_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run python -m cloud.sync
        env:
          READER_API_URL: ${{ vars.READER_API_URL }}
          READER_SYNC_TOKEN: ${{ secrets.READER_SYNC_TOKEN }}
