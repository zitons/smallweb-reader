name: Publish reader to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/cloud-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  publish:
    if: vars.READER_API_URL != ''
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
        working-directory: frontend
      - name: Build static reader
        working-directory: frontend
        env:
          VITE_CLOUD_MODE: 'true'
          VITE_API_BASE_URL: ${{ vars.READER_API_URL }}
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: |
          test -n "$VITE_API_BASE_URL"
          npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
